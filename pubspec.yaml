name: pixel_compressor
description: >
  Image and video compression for Flutter: JPEG/PNG/WebP/HEIC image
  compression with EXIF and rotation, video compression, thumbnails and
  media info. No FFmpeg.
version: 0.3.0
homepage: https://github.com/devamitkumartiwari/pixel_compressor
repository: https://github.com/devamitkumartiwari/pixel_compressor
issue_tracker: https://github.com/devamitkumartiwari/pixel_compressor/issues
topics:
  - image
  - video
  - compression
  - media
  - thumbnail

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  cross_file: '>=0.3.5 <0.3.9'
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: '>=2.0.0 <3.0.0'
  web: '>=1.1.0 <2.0.0'

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.therivanta.pixelcompressor
        pluginClass: PixelCompressorPlugin
        dartPluginClass: PixelImageCompressMobile
        dartFileName: src/image/image_compress_mobile.dart
      ios:
        pluginClass: PixelCompressorPlugin
        dartPluginClass: PixelImageCompressMobile
        dartFileName: src/image/image_compress_mobile.dart
      macos:
        pluginClass: PixelCompressorPlugin
        dartPluginClass: PixelImageCompressMacos
        dartFileName: src/image/image_compress_macos.dart
      web:
        pluginClass: PixelCompressorWebPlugin
        fileName: src/platform/pixel_compressor_web_plugin.dart
