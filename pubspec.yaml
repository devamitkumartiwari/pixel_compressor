name: pixel_compressor
description: >
  Native image and video compression for Flutter — resizing, format
  conversion, thumbnails, metadata, and target-size compression. No FFmpeg.
version: 0.2.0
homepage: https://github.com/devamitkumartiwari/pixel_compressor
repository: https://github.com/devamitkumartiwari/pixel_compressor
issue_tracker: https://github.com/devamitkumartiwari/pixel_compressor/issues
topics:
  - image
  - video
  - compression
  - media
  - thumbnail

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: '>=1.11.0 <1.20.0'
  plugin_platform_interface: '>=2.0.0 <3.0.0'
  web: '>=0.5.0 <2.0.0'

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  pigeon: '>=24.0.0 <30.0.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.therivanta.pixelcompressor
        pluginClass: PixelCompressorPlugin
      ios:
        pluginClass: PixelCompressorPlugin
      macos:
        pluginClass: PixelCompressorPlugin
